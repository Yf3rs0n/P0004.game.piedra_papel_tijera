<div class="container1 flex justify-content-center">
    <p-card [style]="{ width: '365px', overflow: 'hidden' }">
        <ng-template pTemplate="header">
            <img alt="Card" [style]="{ width: '100%', height: '100%'}" src="/assets/img2.jpeg" />
        </ng-template>
        <ng-template pTemplate="title"> Bienvenido </ng-template>
        <div class="flex gap-2 mt-1">
            <p-button label="Jugamos?" severity="success" class="w-full" styleClass="w-full" />
        </div>
    </p-card>
</div>
